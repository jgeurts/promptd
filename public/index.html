<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>promptd</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1115'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23d97757'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/">
        <span class="dot"></span>
        <span id="brand-name">promptd</span>
      </a>
      <div id="summary" class="summary" hidden></div>
      <div class="topbar-right">
        <a id="update-badge" class="badge-update" href="#/settings" hidden>Update available</a>
        <button id="bell" class="btn small icon bell" type="button" title="Notifications" aria-label="Notifications">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6.6a4 4 0 0 1 8 0c0 3 .9 4 1.4 4.5H2.6C3.1 10.6 4 9.6 4 6.6Z" />
            <path d="M6.5 13.3a1.7 1.7 0 0 0 3 0" />
          </svg>
          <span class="bell-marks" aria-hidden="true">
            <span id="bell-dot" class="bell-dot" hidden></span>
            <span id="bell-badge" class="bell-badge" hidden></span>
          </span>
        </button>
        <span id="bell-status" class="sr-only" role="status" aria-atomic="true"></span>
        <span id="activity-status" class="sr-only" role="status" aria-atomic="true"></span>
        <a class="btn small icon" href="#/settings" title="Settings" aria-label="Settings">&#9881;</a>
        <button id="feedback-open" class="btn small icon" type="button" title="Report a bug or suggestion" aria-label="Report a bug or suggestion">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2Z" />
            <path d="M8 5.4v2.2" />
            <path d="M8 9.1v.01" />
          </svg>
        </button>
      </div>
      <div id="warnings" class="warnings" role="group" aria-label="Needs attention" hidden></div>
      <div id="status-panel" class="status-panel" role="dialog" aria-labelledby="status-panel-title" hidden>
        <div class="status-panel-head">
          <h2 id="status-panel-title" tabindex="-1">System status</h2>
          <button id="status-panel-close" class="btn small icon" type="button" title="Close" aria-label="Close">&times;</button>
        </div>
        <div id="status-panel-body" class="status-panel-body"></div>
      </div>
      <div id="status-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    </header>

    <div id="drawer-backdrop" class="drawer-backdrop"></div>
    <aside id="drawer" class="drawer" aria-label="Notifications" aria-hidden="true">
      <div class="drawer-head">
        <h2>Notifications</h2>
        <button id="drawer-close" class="btn small icon" type="button" title="Close" aria-label="Close">&times;</button>
      </div>
      <div class="drawer-tools">
        <button id="drawer-unread" class="btn small" type="button" aria-pressed="false">Unread only</button>
        <button id="drawer-read-all" class="btn small" type="button">Mark all read</button>
      </div>
      <div id="drawer-nodes" class="drawer-nodes" role="group" aria-label="Show one node" hidden></div>
      <p class="drawer-sub">Anything still unread is marked read once it has been on screen for three seconds.</p>
      <div id="drawer-list" class="drawer-list" tabindex="-1"></div>
    </aside>

    <dialog id="feedback" class="dialog" aria-labelledby="feedback-title">
      <form id="feedback-form" method="dialog" class="dialog-body">
        <div class="drawer-head dialog-head">
          <h2 id="feedback-title">Report a bug or suggestion</h2>
          <button id="feedback-close" class="btn small icon" type="button" title="Close" aria-label="Close">&times;</button>
        </div>
        <div class="field">
          <label>Type</label>
          <div class="delay-grid" role="radiogroup">
            <label class="check"><input type="radio" name="kind" value="bug" checked /> Bug</label>
            <label class="check"><input type="radio" name="kind" value="suggestion" /> Suggestion</label>
          </div>
        </div>
        <div class="field">
          <label for="feedback-details">Details</label>
          <textarea id="feedback-details" name="details" class="compact" maxlength="5000" required placeholder="What happened, or what you would like to see"></textarea>
          <span class="hint">Claude summarizes this into a GitHub issue on the project's repository. Its run shows on the One-time Execution tab.</span>
        </div>
        <div id="feedback-error" class="error" hidden></div>
        <div class="form-actions">
          <span class="spacer"></span>
          <button id="feedback-cancel" class="btn" type="button">Cancel</button>
          <button id="feedback-submit" class="btn primary" type="submit">Submit</button>
        </div>
      </form>
    </dialog>

    <main id="view" class="view"></main>

    <div id="toasts" class="toasts"></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
